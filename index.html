<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STA 9715 Practice Exams</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #fbfbf8; --surface: #f1f2ec; --fg: #1c211f; --muted: #5d6763;
  --rule: #d5d9d1; --accent: #1f5f8b;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161a19; --surface: #1f2523; --fg: #e6e9e4; --muted: #9aa5a0;
    --rule: #333b38; --accent: #7fbbe3; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161a19; --surface: #1f2523; --fg: #e6e9e4; --muted: #9aa5a0;
  --rule: #333b38; --accent: #7fbbe3; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--serif); font-size: 18px; line-height: 1.6;
  padding: 40px 16px 80px;
}
main { max-width: 44rem; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.course { font-family: var(--mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-size: 2rem; line-height: 1.2; margin: 4px 0 0; }
header p { color: var(--muted); margin: 6px 0 0; }
h2 { font-size: 1.25rem; margin: 0 0 8px; padding-bottom: 6px; border-bottom: 2px solid var(--fg); }
ul { list-style: none; margin: 0; padding: 0; }
li { border-bottom: 1px solid var(--rule); }
li a {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding: 10px 4px; color: var(--fg); text-decoration: none;
}
li a:hover { background: var(--surface); }
li a:hover .name { color: var(--accent); }
li a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.meta { font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
footer { color: var(--muted); font-size: 15px; border-top: 1px solid var(--rule); padding-top: 16px; }
</style>
</head>
<body>
<main>
<header>
  <div class="course">STA 9715 · Applied Probability · Baruch</div>
  <h1>Practice Exams</h1>
  <p>Worked problems with fold-out solutions.</p>
</header>

<div id="list"></div>

<footer>To add an exam, drop its .html file in this folder and add one line to the EXAMS list in index.html.</footer>
</main>

<script>
// Add new exams here. `group` sets the section heading; sections appear in
// the order their group first shows up. `note` is optional.
const EXAMS = [
  { group: "Chapter 1", file: "ch1-exam.html",              title: "Exam A",                 note: "12 problems" },
  { group: "Chapter 2", file: "ch2-exam.html",              title: "Exam A",                 note: "12 problems" },
  { group: "Chapter 3", file: "ch3-exam.html",              title: "Exam A",                 note: "12 problems" },
  { group: "Chapter 4", file: "ch4-exam.html",              title: "Exam A",                 note: "12 problems" },
  { group: "Chapter 4", file: "ch4-new-problems.html",     title: "Unseen problems",        note: "15 problems" },
  { group: "Chapter 4", file: "ch4-practice-problems.html", title: "Practice problems",      note: "22 problems" },
  { group: "Chapter 5", file: "ch5-exam.html",              title: "Exam A",                 note: "12 problems" },
  { group: "Chapter 5", file: "ch5-exam-2.html",            title: "Exam B",                 note: "12 problems" },
  { group: "Chapter 5", file: "ch5-exam-3.html",            title: "Exam C",                 note: "12 problems" },
  { group: "Cumulative", file: "cumulative-exam-ch1-5.html", title: "Cumulative exam I (Ch 1–5)",  note: "14 problems" },
  { group: "Cumulative", file: "cumulative-exam-2.html",     title: "Cumulative exam II (Ch 1–5)", note: "14 problems" },
  { group: "Midterm practice", file: "midterm-practice-1.html", title: "Midterm practice A", note: "6 problems · 90 min" },
  { group: "Midterm practice", file: "midterm-practice-2.html", title: "Midterm practice B", note: "6 problems · 90 min" },
  { group: "Midterm practice", file: "midterm-practice-3.html", title: "Midterm practice C", note: "6 problems · 90 min" },
];

const groups = new Map();
for (const e of EXAMS) {
  if (!groups.has(e.group)) groups.set(e.group, []);
  groups.get(e.group).push(e);
}
const list = document.getElementById("list");
list.style.cssText = "display:flex;flex-direction:column;gap:28px";
for (const [name, exams] of groups) {
  const sec = document.createElement("section");
  const h = document.createElement("h2");
  h.textContent = name;
  const ul = document.createElement("ul");
  for (const e of exams) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = e.file;
    const t = document.createElement("span");
    t.className = "name";
    t.textContent = e.title;
    a.append(t);
    if (e.note) {
      const m = document.createElement("span");
      m.className = "meta";
      m.textContent = e.note;
      a.append(m);
    }
    li.append(a);
    ul.append(li);
  }
  sec.append(h, ul);
  list.append(sec);
}
</script>
</body>
</html>
